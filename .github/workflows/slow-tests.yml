name: Slow tests

on:
  workflow_dispatch:

concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow:
    name: Tests lents scientifiques
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests marked slow
        run: pytest -q -m slow

      - name: Upload generated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-outputs
          path: data/outputs/
          if-no-files-found: ignore
