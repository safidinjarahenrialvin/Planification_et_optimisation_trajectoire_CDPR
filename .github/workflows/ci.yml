name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tests et smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check app services src scripts tests visualization

      - name: Compile Python modules
        run: python -m compileall -q app services src scripts tests visualization

      - name: Unit and integration tests
        run: pytest -q -m "not slow"

      - name: FAST smoke test
        run: python scripts/run_pipeline.py --fast --output-dir data/ci-output

      - name: Validate smoke artifacts
        run: |
          test -s data/ci-output/validation_report.json
          test -s data/ci-output/comparison_diagnostic.json
          test -s data/ci-output/trajectories_summary.csv

      - name: Streamlit startup health check
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/streamlit.log"
          streamlit run app/streamlit_app.py \
            --server.headless true \
            --server.port 18501 \
            --server.address 127.0.0.1 >"${log_file}" 2>&1 &
          streamlit_pid=$!
          cleanup() {
            kill "${streamlit_pid}" 2>/dev/null || true
            wait "${streamlit_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18501/_stcore/health; then
              exit 0
            fi
            if ! kill -0 "${streamlit_pid}" 2>/dev/null; then
              cat "${log_file}"
              exit 1
            fi
            sleep 1
          done

          cat "${log_file}"
          exit 1
