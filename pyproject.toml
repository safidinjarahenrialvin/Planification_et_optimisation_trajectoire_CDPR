[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-sp2"
version = "0.1.0"
description = "Pipeline scientifique SP2 et interface interactive"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2,<4",
    "scipy>=1.11,<2",
    "pymoo>=0.6,<1",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.37,<2",
    "plotly>=5.18,<8",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "services*", "src*", "visualization*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle
    "W",      # pycodestyle warnings
    "B",      # bugbear
    "RUF",    # règles Ruff spécifiques
    "PIE",
]

ignore = [
    # --- Typographie scientifique : NE PAS toucher ---
    # Ces règles signalent les caractères Unicode mathématiques
    # (×, −, –, ∈, ≤, etc.) comme "ambigus". Dans un projet scientifique
    # francophone, ces caractères sont REQUIS par la typographie et
    # remplacer "7×7" par "7x7" serait une régression sémantique.
    "RUF001",
    "RUF002",
    "RUF003",

    # --- Exceptions aveugles intentionnelles ---
    # Le catch Exception de main() est le pattern CLI standard :
    # intercepter toute erreur pour retourner un code d'échec propre.
    "BLE001",

    # --- Style obsolète (remplacé par UP) ---
    "RUF100",  # noqa inutilisés : bruit sur les scripts
]

[tool.ruff.lint.per-file-ignores]
# Les scripts manipulent sys.path avant les imports (nécessaire).
"scripts/*.py" = ["E402"]
# Les tests tolèrent :
#  - E402   : imports tardifs (sys.path setup)
#  - B011   : assertions dans les tests
#  - B905   : zip() sans strict= (les longueurs sont garanties par construction)
#  - RUF007 : zip(x[:-1], x[1:]) au lieu de itertools.pairwise
#             (plus lisible dans les tests, itertools serait overkill)
#  - RUF059 : variables dépaquetées non utilisées (_ = convention)
"tests/*.py" = ["E402", "B011", "B905", "RUF007", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
